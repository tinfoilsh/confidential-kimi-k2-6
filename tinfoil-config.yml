cvm-version: 0.10.8
cpus: 32
memory: 524288
gpus: 8

models:
  - name: "kimi-k2-6"
    repo: "moonshotai/Kimi-K2.6@2b2b88e33c96d813ebb4c83a740252fe08018e3a"
    mpk: "b9a191a313479bccc692491d74803b2520ae28c90bc440f9c76459d297529956_595205046272_1ea57052-e386-5369-8c4f-853663460858"

containers:
  - name: "kimi-k2-6"
    models: ["kimi-k2-6"]
    image: "vllm/vllm-openai:v0.25.0@sha256:fc56161ee42a011aeee78b65d0a81b6683c7d04402fd40503d14d4d6c98f07cb"
    runtime: nvidia
    gpus: all
    restart: always
    env:
      - PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
      - NUMBA_CACHE_DIR: "/root/numba-cache"
      - VLLM_ALLREDUCE_USE_SYMM_MEM: "0"
    command: ["--model", "/tinfoil/models/kimi-k2-6", "--tensor-parallel-size",
      "8", "--mm-encoder-tp-mode", "data", "--served-model-name", "kimi-k2-6", "--enable-auto-tool-choice", "--enable-prompt-tokens-details",
      "--tool-call-parser", "kimi_k2", "--reasoning-parser", "kimi_k2", "--trust-remote-code", "--scheduling-policy", "priority",
      "--disable-custom-all-reduce", "--compilation-config", "{\"pass_config\":{\"fuse_allreduce_rms\":false}}",
      "--port", "8001"]
    tmpfs:
      /tmp: size=512m,mode=1777,exec
      /root: size=20g,mode=0700,exec
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      start_period: 60m

shim:
  upstream-port: 8001
  authenticated: true
  authenticated-endpoints:
    - /v1/chat/completions
    - /v1/responses
    - /tokenize
    - /metrics
  paths:
    - /v1/chat/completions
    - /v1/responses
    - /tokenize
    - /metrics
    - /health
